<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Balatro Web Port</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111827'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f87171'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; height: 100dvh; box-sizing: border-box; touch-action: none;
           padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #000; }
  #view { position: relative; width: 100%; height: 100%; }
  #game { display: block; touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 15px; letter-spacing: .08em; background: #000; z-index: 5; transition: opacity .4s; }
  #loading.done { opacity: 0; pointer-events: none; }
  .atb-bar { position: fixed; top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); display: flex; gap: 4px; align-items: center; z-index: 10; opacity: .28; transition: opacity .2s; }
  .atb-bar:hover, .atb-bar:focus-within, .atb-bar.open { opacity: 1; }
  .atb-tools { display: none; gap: 4px; align-items: center; }
  .atb-bar.open .atb-tools { display: flex; }
  .atb-btn { min-width: 44px; min-height: 44px; border: 1px solid #fff3; border-radius: 8px; background: #111827cc; color: #e2e8f0; font-size: 18px; cursor: pointer; }
  .atb-btn:hover { background: #1f2937; }
  .atb-badge { color: #38bdf8; font-size: 12px; text-decoration: none; padding: 0 8px; min-height: 44px; display: inline-flex; align-items: center; background: #111827cc; border-radius: 8px; border: 1px solid #fff3; }
  .atb-toast { position: fixed; left: 50%; bottom: 8%; transform: translate(-50%, 20px); background: #111827ee; color: #f8fafc; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: all .35s; z-index: 30; font-size: 14px; max-width: 86vw; text-align: center; }
  .atb-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .atb-modal { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; z-index: 40; }
  .atb-card { background: #0f172a; color: #e2e8f0; border: 1px solid #38bdf855; border-radius: 14px; padding: 20px 22px; max-width: min(92vw, 460px); box-shadow: 0 10px 40px #000a; }
  .atb-card pre { white-space: pre-wrap; font-size: 12px; max-height: 40vh; overflow: auto; background: #020617; padding: 8px; border-radius: 6px; }
  .atb-card a { color: #38bdf8; }
  .atb-card button { margin-top: 6px; padding: 10px 18px; min-height: 44px; border-radius: 8px; border: 0; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; }
  .atb-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .atb-rotate { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); background: #111827ee; color: #fde68a; padding: 8px 14px; border-radius: 10px; z-index: 20; font-size: 13px; display: none; }
  @media (max-width: 600px) { .atb-badge { display: none; } }
</style>
</head>
<body>
<div id="stage"><div id="view"><canvas id="game" tabindex="0"></canvas></div></div>
<div id="loading">LOADING…</div>
<noscript>This game needs JavaScript and WebGL2.</noscript>
<script>
/* Dual-path loader: assets/ and src/ next to this page (web/assets symlink, or a server rooted at the port) or ../ (file:// / server rooted at web/ with the symlinks absent). */
(function () {
  var bases = ['./', '../'], base = null;
  var scripts = [
    'assets/lua_bundle.js', 'assets/data/data.js', 'assets/images_data.js', 'assets/shaders.js', 'assets/fonts/font_data.js', 'assets/fonts/cjk_fonts.js',
    'src/lib/fengari.min.js', 'src/host/lua_bridge.js', 'src/host/core.js', 'src/host/gfx_gl.js', 'src/host/gfx_text.js', 'src/host/gfx_2d.js',
    'src/host/audio.js', 'src/main.js', 'src/ui.js'
  ];
  function load(path, bi, ok, fail) {
    var s = document.createElement('script');
    s.src = bases[bi] + path;
    s.onload = function () { base = bi; ok(); };
    s.onerror = function () { s.remove(); if (bi + 1 < bases.length && base === null) load(path, bi + 1, ok, fail); else fail(path); };
    document.head.appendChild(s);
  }
  function seq(i, done, fail) {
    if (i >= scripts.length) return done();
    var path = scripts[i];
    var tryBase = base === null ? 0 : base;
    load(path, tryBase, function () { seq(i + 1, done, fail); }, fail);
  }
  function showFail(p) { var l = document.getElementById('loading'); l.textContent = 'Failed to load ' + p; }
  window.ATB_BASE = function () { return bases[base || 0]; };
  seq(0, function () { window.__atbBootstrap(); }, showFail);
})();

window.__atbBootstrap = function () {
  var ATB = window.ATB;
  var stage = document.getElementById('view');
  var canvas = document.getElementById('game');
  var loading = document.getElementById('loading');
  ATB.ui.banner();
  var rt = new ATB.Runtime(canvas, stage);
  window.ATB_RT = rt;
  rt.onError = function (e) { ATB.ui.errorOverlay(e); };
  function restart() {
    rt.stop();
    rt.audio.srcStopAll();
    try { rt.boot(); rt.start(); } catch (e) { rt.fail(e); }
  }
  rt.init().then(function () {
    rt.boot();
    ATB.ui.buildChrome(rt, restart);
    ATB.ui.orientationHint();
    rt.start();
    loading.classList.add('done');
    setTimeout(function () { loading.remove(); }, 600);
    canvas.focus();
  }).catch(function (e) { rt.fail(e); loading.remove(); });
};
</script>
</body>
</html>
